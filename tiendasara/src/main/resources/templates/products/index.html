<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos - Tienda Sara</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Tienda Sara</span>
        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <h1 class="h2 mb-0">Productos</h1>
            <a class="btn btn-primary" th:href="@{/products/new}">
                Crear producto
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Descripción</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">ID de categoría</th>
                                <th scope="col">ID de marca</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <td th:text="${product.id}"></td>
                                <td th:text="${product.descripcion}"></td>
                                <td th:text="${product.precio}"></td>
                                <td th:text="${product.cantidad}"></td>
                                <td th:text="${product.idCategoria}"></td>
                                <td th:text="${product.idMarca}"></td>
                                <td>
                                    <div class="d-flex flex-wrap gap-2">
                                        <a class="btn btn-sm btn-warning"
                                           th:href="@{/products/edit/{id}(id=${product.id})}">
                                            Editar
                                        </a>
                                        <a class="btn btn-sm btn-danger"
                                           th:href="@{/products/delete/{id}(id=${product.id})}"
                                           onclick="return confirm('¿Seguro que quieres eliminar este producto?')">
                                            Eliminar
                                        </a>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    Todavía no hay productos registrados.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
