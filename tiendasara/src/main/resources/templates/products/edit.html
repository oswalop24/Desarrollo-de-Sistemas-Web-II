<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar producto - Tienda Sara</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/products}">Tienda Sara</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h1 class="h3 mb-0">Editar producto</h1>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/products/{id}(id=${product.id})}" th:object="${product}" method="post">

                            <div class="mb-3">
                                <label for="id" class="form-label">ID</label>
                                <input type="text" class="form-control" id="id" th:field="*{id}" readonly>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <input type="text" class="form-control" id="descripcion" th:field="*{descripcion}" required>
                            </div>

                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio</label>
                                <input type="number" class="form-control" id="precio" th:field="*{precio}" min="0" step="0.01" required>
                            </div>

                            <div class="mb-3">
                                <label for="cantidad" class="form-label">Cantidad</label>
                                <input type="number" class="form-control" id="cantidad" th:field="*{cantidad}" min="0" step="1" required>
                            </div>

                            <div class="mb-3">
                                <label for="idCategoria" class="form-label">Categoría</label>
                                <select class="form-select" id="idCategoria" th:field="*{idCategoria}" required>
                                    <option value="">Selecciona una categoría</option>
                                    <option th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.descripcion}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="idMarca" class="form-label">Marca</label>
                                <select class="form-select" id="idMarca" th:field="*{idMarca}" required>
                                    <option value="">Selecciona una marca</option>
                                    <option th:each="mark : ${marks}"
                                            th:value="${mark.id}"
                                            th:text="${mark.descripcion}">
                                    </option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-warning">Guardar cambios</button>
                                <a class="btn btn-outline-secondary" th:href="@{/products}">Cancelar</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
